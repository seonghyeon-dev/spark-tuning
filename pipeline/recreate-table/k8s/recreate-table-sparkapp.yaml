# Iceberg 테이블 재생성 + tmp_id(NOT NULL) 추가 — 1회성 SparkApplication (spark-operator)
#
# 사용 순서 (자세한 절차는 ../README.md):
#   1. Airflow 쓰기 DAG 일시 중지
#   2. arguments: ["check"] 로 apply → 로그의 unmatched 건수·타입 대조 확인 → 리소스 삭제
#   3. arguments: ["run"]   로 apply → 완료 로그 확인
#   4. Airflow 재개, 며칠 뒤 백업 테이블 DROP ... PURGE
#
# ⚠ restartPolicy 는 반드시 Never. DROP 이후 실패한 Job 을 operator 가 재시도하면
#   [0] 사전 검사(백업 존재)에서 막히긴 하지만, 재시도 자체가 있어서는 안 된다.
#
# <...> 로 표시한 값은 운영 환경의 기존 Compaction/append SparkApplication 에서 복사한다.
# 카탈로그 이름(<catalog>)은 RecreateTable.scala 의 `Catalog` 와 같아야 한다.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: recreate-table-tmp-id
  namespace: <spark-job-namespace>
spec:
  type: Scala
  mode: cluster
  # 운영 태그 그대로 (Spark 3.5.8 / Scala 2.12 / Iceberg 1.10.1 runtime 이 $SPARK_HOME/jars 에 있는 이미지)
  image: <registry>/<spark-image>:<운영-3.5.8-태그>
  imagePullPolicy: IfNotPresent
  sparkVersion: 3.5.8

  # sbt assembly 산출물. fs.s3a.* 설정으로 driver 가 내려받는다 (또는 이미지에 넣고 local:///... 로 지정)
  mainApplicationFile: s3a://<bucket>/jars/recreate-table-assembly.jar
  mainClass: RecreateTable
  arguments:
    - "check"          # check → 확인 후 → run   (실패 재개는 resume)

  restartPolicy:
    type: Never
  timeToLiveSeconds: 86400   # 완료 후 하루 동안 Pod/로그 보존

  sparkConf:
    # ── Iceberg 카탈로그 (HMS) — 기존 Job 설정과 동일하게 ──────────────────
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.<catalog>: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.<catalog>.type: hive
    spark.sql.catalog.<catalog>.uri: thrift://<hive-metastore>:9083
    spark.sql.catalog.<catalog>.warehouse: s3a://<bucket>/<warehouse>
    # io-impl 은 지정하지 않는다 → HadoopFileIO(S3A). append Job 과 같은 경로로 쓴다.
    # S3FileIO 로 쓰려면 아래 4줄 + iceberg-aws-bundle jar 가 이미지에 있어야 한다 (가이드 §5.1)
    # spark.sql.catalog.<catalog>.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    # spark.sql.catalog.<catalog>.s3.endpoint: http://<minio-service>:9000
    # spark.sql.catalog.<catalog>.s3.path-style-access: "true"
    # spark.sql.catalog.<catalog>.client.region: us-east-1

    # ── S3A (MinIO) — 기존 fs.s3a.* 그대로. jar 다운로드·eventLog·Iceberg 파일 IO 전부 이 경로 ──
    spark.hadoop.fs.s3a.endpoint: <minio-service>:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    spark.hadoop.fs.s3a.access.key: <ACCESS_KEY>
    spark.hadoop.fs.s3a.secret.key: <SECRET_KEY>

    # ── eventLog (기존 Job 과 동일 위치) ────────────────────────────────────
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: s3a://<bucket>/logs/spark

    # ── 이 Job 전용 ─────────────────────────────────────────────────────────
    # 데이터 ~1.5GB. INSERT 는 write.distribution-mode=range 로 shuffle 되므로 파티션 수를 낮게 둔다
    spark.sql.shuffle.partitions: "32"
    spark.sql.adaptive.enabled: "true"
    # 1회성 Job 이라 dynamic allocation 미사용 — instances 고정
    spark.dynamicAllocation.enabled: "false"

  driver:
    cores: 2
    coreLimit: "2"          # availableProcessors() 함정 방지 (가이드 §5.1.2)
    memory: 4g
    serviceAccount: <spark-service-account>
    labels:
      app: recreate-table
    env: &jobEnv
      # Oracle 접속 정보는 코드에 하드코딩 (1회성). 여기엔 MinIO 자격증명만 (S3FileIO 사용 시 필요)
      - name: AWS_REGION
        value: us-east-1
      # - name: AWS_ACCESS_KEY_ID
      #   valueFrom: { secretKeyRef: { name: minio-credentials, key: access-key } }
      # - name: AWS_SECRET_ACCESS_KEY
      #   valueFrom: { secretKeyRef: { name: minio-credentials, key: secret-key } }
  executor:
    instances: 2
    cores: 2
    coreLimit: "2"
    memory: 4g
    labels:
      app: recreate-table
    env: *jobEnv

  # Oracle 이 K8s 외부라면 driver·executor 양쪽에서 <oracle-host>:1521 접근이 열려 있어야 한다.
  # JDBC 읽기는 executor 에서 실행된다 (driver 만 열어 두면 [2] 단계에서 connection refused).
