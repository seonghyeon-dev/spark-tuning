# RecreateTable 앱 실행용 SparkApplication — 기존 append/Compaction Job 스펙을 복사해 쓴다.
#
# Iceberg 접근(카탈로그·S3A·eventLog·serviceAccount·이미지)은 기존 Job 이 이미 되는 상태이므로
# 그 스펙을 그대로 가져오고, 아래 ★ 표시 항목만 바꾼다. 신규는 Oracle 접근뿐이며
# ojdbc8 은 fat jar 안에 있어 이미지·--jars 변경이 없다.
#
# 실행: arguments 를 backup → check → (수동 DDL: ../manual-ddl.sql) → load 순으로 바꿔 가며 apply 한다.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: recreate-table-tmp-id                       # ★
  namespace: <기존 Job 과 동일>
spec:
  type: Scala
  mode: cluster
  image: <기존 Job 과 동일 — Spark 3.5.8 / Scala 2.12 / Iceberg 1.10.1 runtime 포함 이미지>
  sparkVersion: 3.5.8

  mainApplicationFile: s3a://<bucket>/jars/recreate-table-assembly.jar   # ★ sbt assembly 산출물
  mainClass: RecreateTable                                               # ★
  arguments:                                                             # ★ backup | check | load
    - "check"

  restartPolicy:
    type: Never              # ★ 실패 시 operator 재시도 금지 — 각 모드가 멱등이 아니다
  timeToLiveSeconds: 86400   # 완료 후 하루 동안 Pod/로그 보존

  sparkConf:
    # ── 기존 Job 의 sparkConf 를 그대로 (spark.sql.extensions, spark.sql.catalog.*, fs.s3a.*, eventLog ...) ──
    # spark.sql.catalog.<catalog> 의 이름이 RecreateTable.scala 의 Catalog 와 같아야 한다.

    # ── 이 Job 전용 ─────────────────────────────────────────────────────────
    spark.sql.shuffle.partitions: "32"        # 데이터 ~1.5GB. range 분배 shuffle 이라 낮게
    spark.sql.adaptive.enabled: "true"
    spark.dynamicAllocation.enabled: "false"  # 1회성이라 instances 고정

  driver:
    cores: 2
    coreLimit: "2"
    memory: 4g
    serviceAccount: <기존 Job 과 동일>
    env:
      # 기존 Job 의 env 그대로 (MinIO 자격증명 등). Oracle 접속 정보는 코드에 하드코딩이라 env 불필요
      - name: AWS_REGION
        value: us-east-1
  executor:
    instances: 2
    cores: 2
    coreLimit: "2"
    memory: 4g

  # Oracle 이 K8s 밖이라면 driver·executor 양쪽에서 <oracle-host>:1521 이 열려 있어야 한다.
  # JDBC 읽기는 executor 에서 실행된다 — driver 만 열어 두면 [ora] 단계에서 connection refused.
